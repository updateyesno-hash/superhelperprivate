name: collect
on:
  workflow_dispatch:
    inputs:
      mode:   { description: "get или split", default: "get" }
      protos: { description: "протоколы через запятую, пусто = все", default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect.py
        env:
          MODE: ${{ inputs.mode }}
          PROTOS: ${{ inputs.protos }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
